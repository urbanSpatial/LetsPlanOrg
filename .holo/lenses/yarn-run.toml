[hololens]
container = "ghcr.io/hologit/lenses/yarn-run:v2"

[hololens.input]
files = [
    "package.json",
    "yarn.lock",
    "webpack.mix.js",

    # artisan command is irrelevant to building frontend assets,
    # but laravel-mix sniffs for its presence to "see" Laravel:
    # https://github.com/JeffreyWay/laravel-mix/blob/467f0c9b01b7da71c519619ba8b310422321e0d6/src/Mix.js#L189
    "artisan",

    "resources/data/**",
    "resources/js/**",
    "resources/scss/**",
]

[hololens.yarn-run]
command = "production"
output_dir = "public"

# the locked webpack/postcss toolchain predates Node 17 (md4 hashing, "./"
# exports mappings), so build on Node 14 like the old habitat lens did
node_version = "14"

[hololens.output]
root = "public"
merge = "overlay"
